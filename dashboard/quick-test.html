<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Brain CBT | Quick Test</title>
  <link rel="icon" type="image/png" href="../img/Smart-brain-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=2">
  <link rel="stylesheet" href="../css/dashboard.css?v=2">
</head>
<body>

<header class="header">
  <div class="container header-container">
    <div class="brand">
      <div class="logo"><i class="fas fa-brain"></i></div>
      <h1 class="brand-name">Smart Brain <span class="cbt">CBT</span></h1>
    </div>
    <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    <nav class="desktop-nav">
      <ul class="desktop-nav-list">
        <li class="desktop-nav-item"><a href="../index.html" class="desktop-nav-link"><i class="fas fa-home"></i> Home</a></li>
        <li class="desktop-nav-item"><a href="../index.html#features" class="desktop-nav-link"><i class="fas fa-star"></i> Features</a></li>
        <li class="desktop-nav-item"><a href="../index.html#exams" class="desktop-nav-link"><i class="fas fa-book"></i> Exams</a></li>
        <li class="desktop-nav-item"><a href="../index.html#contact" class="desktop-nav-link"><i class="fas fa-envelope"></i> Contact</a></li>
        <li class="desktop-nav-item"><a href="dashboard.html" class="desktop-nav-link active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
      </ul>
    </nav>
  </div>
</header>

<nav class="mobile-menu" id="mobileMenu">
  <div class="container">
    <ul class="nav-list">
      <li><a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="../index.html#features" class="nav-link"><i class="fas fa-star"></i> Features</a></li>
      <li><a href="../index.html#exams" class="nav-link"><i class="fas fa-book"></i> Exams</a></li>
      <li><a href="../index.html#contact" class="nav-link"><i class="fas fa-envelope"></i> Contact</a></li>
      <li><a href="dashboard.html" class="nav-link active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
    </ul>
  </div>
</nav>

<main class="dashboard">
  <div class="dashboard-container">
    <section class="practice-section" id="quickTestSection">
      <div class="section-header">
        <h2><i class="fas fa-bolt"></i> Quick Test (20 questions, 20 mins)</h2>
        <p class="section-subtitle">Select your exam and subject to begin</p>
      </div>
      <form class="practice-form" id="quickTestForm">
        <div class="form-row">
          <div class="form-group">
            <label for="classSelect"><i class="fas fa-graduation-cap"></i> Select Exam</label>
            <select id="classSelect" class="form-select" required>
              <option value="" disabled selected>Choose your exam</option>
              <option value="waec">WAEC/NECO</option>
              <option value="jamb">JAMB</option>
            </select>
          </div>
          <div class="form-group">
            <label for="subjectSelect"><i class="fas fa-book"></i> Select Subject</label>
            <select id="subjectSelect" class="form-select" required>
              <option value="" disabled selected>Choose subject</option>
            </select>
          </div>
          <button type="button" id="startQuickTestBtn" class="start-test-btn">
            <i class="fas fa-play-circle"></i> Start Quick Test
          </button>
        </div>
      </form>
    </section>

    <footer class="dashboard-footer">
      <div class="footer-content">
        <div class="footer-nav">
          <a href="dashboard.html" class="home-btn"><i class="fas fa-tachometer-alt"></i> Back to Dashboard</a>
          <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="footer-copyright">
          <p>© 2026 Smart Brain CBT • Empowering students through technology</p>
        </div>
      </div>
    </footer>
  </div>
</main>

<script type="module" src="../js/main.js?v=2"></script>
<script type="module" src="../js/auth.js?v=2"></script>
<script type="module" src="../js/dashboard.js?v=2"></script>
<script type="module" src="../js/script.js?v=2"></script>
</body>
</html>
