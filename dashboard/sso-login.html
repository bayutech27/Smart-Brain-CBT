<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Signing you in… | Smart Brain CBT</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Poppins', sans-serif;
      background:
        radial-gradient(ellipse 60% 50% at 15% 0%, rgba(10,132,255,0.22), transparent 60%),
        radial-gradient(ellipse 70% 55% at 90% 5%, rgba(191,90,242,0.20), transparent 60%),
        radial-gradient(ellipse 90% 60% at 50% 105%, rgba(100,210,255,0.12), transparent 60%),
        #06060a;
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(28,28,34,0.92);
      border: 1px solid rgba(140,155,200,0.14);
      border-radius: 22px;
      padding: 34px 26px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #0a84ff;
      margin: 0 auto 22px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 13px; color: rgba(235,235,245,0.65); line-height: 1.6; }
    .icon { font-size: 36px; margin-bottom: 12px; display: block; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 24px;
      border-radius: 100px;
      background: linear-gradient(135deg, #0a84ff, #409cff);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(10,132,255,0.35);
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Signing you in…</h1>
    <p id="status">Connecting you to your Smart Brain practice dashboard.</p>
  </div>

  <script type="module">
    import { auth, db } from '../js/main.js';
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import {
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    // Deterministic password derivation — MUST stay in sync with Acadex.
    function deriveSmartBrainPassword(acadexUid) {
      return 'SB-' + acadexUid + 'Aa1!';
    }

    function showError(titleText, messageHtml) {
      const spinner = document.getElementById('spinner');
      if (spinner) spinner.style.display = 'none';
      document.getElementById('title').innerHTML =
        '<span class="icon">⚠️</span>' + titleText;
      document.getElementById('status').innerHTML = messageHtml;
    }

    function showSlowNotice() {
      const status = document.getElementById('status');
      if (status) {
        status.innerHTML +=
          '<br><br><span style="font-size:12px;opacity:0.7;">Still connecting — this can take a few seconds on slow networks.</span>';
      }
    }

    const params = new URLSearchParams(window.location.search);
    const email     = (params.get('e') || '').trim().toLowerCase();
    const acadexUid = (params.get('u') || '').trim();
    const name      = (params.get('n') || '').trim() || 'Student';
    const schoolId  = (params.get('s') || '').trim();
    const returnUrl = (params.get('r') || '').trim();

    // Persist return URL to localStorage so the dashboard can offer
    // a "Return to Acadex" button even across navigations & refreshes.
    if (returnUrl) {
      try { localStorage.setItem('acadexReturnUrl', returnUrl); } catch (e) { /* non-fatal */ }
    }

    if (!email || !acadexUid || !schoolId) {
      showError(
        'Cannot sign you in',
        'This page can only be reached from your Acadex student dashboard.<br><br>Please go back to Acadex and click <strong>Practice Tests</strong> again.'
      );
    } else {
      const password = deriveSmartBrainPassword(acadexUid);
      const slowTimer = setTimeout(showSlowNotice, 12000);

      (async () => {
        try {
          let userCredential = null;
          try {
            userCredential = await signInWithEmailAndPassword(auth, email, password);
          } catch (loginErr) {
            const code = loginErr.code || '';
            const isMissing =
              code === 'auth/user-not-found' ||
              code === 'auth/invalid-credential' ||
              code === 'auth/wrong-password';

            if (!isMissing) throw loginErr;

            try {
              userCredential = await createUserWithEmailAndPassword(auth, email, password);
              try {
                await updateProfile(userCredential.user, { displayName: name });
              } catch (p) { /* non-fatal */ }

              const userRef = doc(db, 'users', userCredential.user.uid);
              await setDoc(userRef, {
                fullName: name,
                email: email,
                profilePicture: '',
                totalTestsTaken: 0,
                joinedAt: serverTimestamp(),
                status: 'active',
                tutorialCenterId: null,
                acadexUid: acadexUid,
                acadexSchoolId: schoolId,
                acadexReturnUrl: returnUrl || null,
                source: 'acadex'
              }, { merge: true });
            } catch (createErr) {
              if (createErr.code === 'auth/email-already-in-use') {
                showError(
                  'Account already exists',
                  'This email is already registered on Smart Brain with a different password (likely because you signed up manually before).<br><br>' +
                  '<a class="btn" href="../login.html">Sign in manually</a>'
                );
                return;
              }
              throw createErr;
            }
          }

          // Best-effort: stamp any missing Acadex metadata onto existing accounts
          try {
            const userRef = doc(db, 'users', userCredential.user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
              const data = snap.data();
              const updates = {};
              if (!data.acadexUid) updates.acadexUid = acadexUid;
              if (!data.acadexSchoolId) updates.acadexSchoolId = schoolId;
              if (!data.acadexReturnUrl && returnUrl) updates.acadexReturnUrl = returnUrl;
              if (!data.source) updates.source = 'acadex';
              if (Object.keys(updates).length > 0) {
                await setDoc(userRef, updates, { merge: true });
              }
            }
          } catch (e) { /* non-fatal */ }

          // Success → SmartBrain practice dashboard
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('title').textContent = 'Success!';
          document.getElementById('status').textContent = 'Opening your practice dashboard…';
          window.location.replace('dashboard.html');
        } catch (err) {
          console.error('SSO error:', err);
          showError(
            'Sign-in failed',
            (err.message || 'An unexpected error occurred.') +
            '<br><br><a class="btn" href="../login.html">Sign in manually</a>'
          );
        } finally {
          clearTimeout(slowTimer);
        }
      })();
    }
  </script>
</body>
</html>
